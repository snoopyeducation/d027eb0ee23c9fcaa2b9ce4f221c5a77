<!DOCTYPE html>
<html>
  <head>
      <link id="icon" rel="icon" href=""/>
      <title id="title"></title>
      <meta charset="UTF-8">
  </head>
  <style>
      *{
          padding: 0; margin: 0;
      }
  </style>
  <body>
      <iframe id="shell-frame" style="border:none; width:100%; height: 100%; position: absolute; top: 0; left: 0;"></iframe>
      <script>
        const params = new URLSearchParams(window.location.search);
    
        if(params.get('icon')){
            document.getElementById("icon").setAttribute("href", params.get('icon'));
        }
    
        if(params.get('title')){
            document.getElementById("title").innerHTML = params.get('title');
        }
        
        if(params.get('url')){
            let sourceURL = params.get('url');
    
            fetch(sourceURL)
            .then(response => response.text())
            .then(data => {
                setPage(data);
            })
            .catch(error => alert('Fetch error:', error))
        } else if(params.get('lc')){
            let localStorageKey = params.get('lc');
    
            if(localStorage.getItem("webshell-" + localStorageKey)){
                document.getElementById("icon").setAttribute("href", "webshell-" + localStorageKey + "-icon");
                document.getElementById("title").innerHTML = localStorageKey
                setPage(localStorage.getItem("webshell-" + localStorageKey));
            } else {
                document.getElementById("title").innerHTML = "File Not found";
                document.getElementById("icon").setAttribute("href", "images/favicon.png");
                setPage(`<!DOC` + `TYPE html>
                <htm` + `l lang="en">
                <he` + `ad>
                <meta charset="UTF-8" />
                <meta name="viewport" content="width=device-width, initial-scale=1.0" />
                <title>Webshell — File not found</title>
                <style>
                :root {
                    --bg: #0c0e0d;
                    --panel: #111413;
                    --line: #1f2422;
                    --text: #d8ddd9;
                    --dim: #6b7570;
                    --accent: #58e6a1;
                }
                
                * { margin: 0; padding: 0; box-sizing: border-box; }
                
                html, body {
                    height: 100%;
                }
                
                body {
                    background: var(--bg);
                    color: var(--text);
                    font-family: "SF Mono", "JetBrains Mono", "Fira Code", ui-monospace, Menlo, Consolas, monospace;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    padding: 24px;
                }
                
                @media (prefers-reduced-motion: no-preference) {
                    .cursor { animation: blink 1.1s step-end infinite; }
                }
                
                @keyframes blink {
                    0%, 49% { opacity: 1; }
                    50%, 100% { opacity: 0; }
                }
                
                .frame {
                    width: 100%;
                    max-width: 560px;
                    border: 1px solid var(--line);
                    border-radius: 6px;
                    background: var(--panel);
                    overflow: hidden;
                }
                
                .titlebar {
                    display: flex;
                    align-items: center;
                    gap: 8px;
                    padding: 10px 14px;
                    border-bottom: 1px solid var(--line);
                    font-size: 12px;
                    color: var(--dim);
                    letter-spacing: 0.02em;
                }
                
                .dot {
                    width: 9px;
                    height: 9px;
                    border-radius: 50%;
                    background: var(--line);
                }
                
                .titlebar span.label {
                    margin-left: 4px;
                }
                
                .body {
                    padding: 32px 28px 30px;
                }
                
                .prompt {
                    font-size: 13px;
                    color: var(--dim);
                    margin-bottom: 18px;
                }
                
                .prompt .accent { color: var(--accent); }
                
                h1 {
                    font-size: 17px;
                    font-weight: 500;
                    color: var(--text);
                    margin-bottom: 10px;
                    letter-spacing: -0.01em;
                }
                
                h1 .accent { color: var(--accent); }
                
                p.detail {
                    font-size: 13px;
                    line-height: 1.6;
                    color: var(--dim);
                    max-width: 46ch;
                    margin-bottom: 22px;
                }
                
                code.path {
                    color: var(--text);
                    background: #171b19;
                    border: 1px solid var(--line);
                    border-radius: 4px;
                    padding: 1px 6px;
                    font-size: 12.5px;
                }
                
                .footer-line {
                    display: flex;
                    align-items: center;
                    font-size: 13px;
                    color: var(--dim);
                }
                
                .footer-line .accent { color: var(--accent); }
                </style>
                </he` + `ad>
                <bo` + `dy>
                
                <div class="frame">
                    <div class="titlebar">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <span class="label">webshell</span>
                    </div>
                
                    <div class="body">
                
                    <h1><span class="accent">✕</span> Source not found</h1>
                
                    <p class="detail">
                        The URL passed to Webshell didn't return a locally saved source. Check that the lc= is set to the correct file.
                    </p>
                
                    <div class="footer-line">webshell<span class="cursor accent">_</span></div>
                    </div>
                </div>
                
                </bo` + `dy>
                </ht` + `ml>`)
            }
        } else {
            showHome();
        }
    
        function setPage(code) {
            let frame = document.getElementById('shell-frame');
            if (frame) {
                const frameDoc = frame.contentDocument || frame.contentWindow.document;
                frameDoc.open();
                frameDoc.write(code);
                frameDoc.close();
            }
        }
        
        function showHome() {
            const HOME_PAGE = `
        <!DOC` + `TYPE ht` + `ml>
            <html lang="en">
            <he` + `ad>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <style>
            :root {
                --bg: #0c0e0d;
                --panel: #111413;
                --line: #1f2422;
                --text: #d8ddd9;

            html, body { height: 100%; }
            body {
                background: var(--bg);

            .frame {

                max-width: 560px;

                border-radius: 6px;
                background: var(--panel);
                overflow: hidden;
            }
            .titlebar {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 10px 14px;
                border-bottom: 1px solid var(--line);
                font-size: 12px;
                color: var(--dim);
            }
            .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
            .body { padding: 32px 28px 30px; }
            h1 { font-size: 17px; font-weight: 500; margin-bottom: 10px; }
            h1 .accent { color: var(--accent); }
            p.detail { font-size: 13px; line-height: 1.6; color: var(--dim); max-width: 46ch; margin-bottom: 18px; }
            code.path { color: var(--text); background: #171b19; border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; font-size: 12.5px; }
            .btn {
                background: #171b19;
                color: var(--text);
                border: 1px solid var(--line);
                border-radius: 4px;
                padding: 10px 14px;
                cursor: pointer;
                font-family: inherit;
                transition: 0.15s;
            }
    
            .btn:hover {
                border-color: var(--accent);
            }
    
            .secondary {
                opacity: 0.8;
            }
    
            .modal {
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.65);
                display: none;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }
    
            .modal.show {
                display: flex;
            }
    
            .modal-content {
                width: min(900px, 95vw);
                height: min(700px, 90vh);
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 20px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
    
            .modal-content h2 {
                font-size: 18px;
                font-weight: 500;
            }
    
            .modal-content label {
                font-size: 13px;
                color: var(--dim);
            }
    
            .modal-content input,
            .modal-content textarea {
                width: 100%;
                background: #171b19;
                color: var(--text);
                border: 1px solid var(--line);
                border-radius: 4px;
                padding: 10px;
                font-family: inherit;
                resize: none;
            }
    
            .modal-content input {
                height: 40px;
            }
    
            #htmlEditor {
                flex: 1;
                min-height: 300px;
            }
    
            .actions {
                display: flex;
                justify-content: flex-end;
                gap: 10px;
            }
            </style>
            </head>
            <body>
            <div class="frame">
                <div class="titlebar">
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                    <span style="margin-left:4px;">webshell</span>
                </div>
                <div class="body">
                    <h1><span class="accent">›</span> Webshell: Create ChromeOS web apps</h1>
                    <p class="detail">Pass a source to load it — either a remote file or a locally saved one.</p>
                    <p class="detail">
                        <code class="path">?url=</code> a direct link to an HTML file<br/>
                        <code class="path">?lc=</code> an app saved locally<br/>
                        <code class="path">&icon=</code> favicon URL<br/>
                        <code class="path">&title=</code> tab title
                    </p>
                    <button id="createLocalAppBtn" class="btn">Create Local App...</button>
                </div>
            </div>
            <div id="localAppMenu" class="modal">
                <div class="modal-content">
                    <h2>Create Local App</h2>
    
                    <label>App Name</label>
                    <input type="text" id="appName" placeholder="My App">
    
                    <label>Favicon URL</label>
                    <input type="text" id="faviconUrl" placeholder="https://example.com/favicon.ico">
    
                    <label>HTML Code</label>
                    <textarea id="htmlEditor" placeholder="Paste HTML here"></textarea>
    
                    <div class="actions">
                        <button id="closeMenu" class="btn secondary">Cancel</button>
                        <button id="createApp" class="btn">Create App</button>
                    </div>
                </div>
            </div>
            <scr` + `ipt>
                const createLocalAppBtn = document.getElementById("createLocalAppBtn");
                const localAppMenu = document.getElementById("localAppMenu");
                const closeMenu = document.getElementById("closeMenu");
    
                createLocalAppBtn.onclick = () => {
                    localAppMenu.classList.add("show");
                };
    
                closeMenu.onclick = () => {
                    localAppMenu.classList.remove("show");
                };
    
                localAppMenu.onclick = (e) => {
                    if (e.target === localAppMenu) {
                        localAppMenu.classList.remove("show");
                    }
                };
    
                document.getElementById("createApp").onclick = () => {
                    const html = document.getElementById("htmlEditor").value;
                    const name = document.getElementById("appName").value;
                    const favicon = document.getElementById("faviconUrl").value;
    
                    localStorage.setItem("webshell-" + name, html);
                    localStorage.setItem("webshell-" + name + "-favicon", favicon);
                    localAppMenu.classList.remove("show");
                };
            </scr` + `ipt>
            </bo` + `dy>
            </ht` + `ml>`
            document.getElementById("title").innerHTML = "Webshell";
            document.getElementById("icon").setAttribute("href", "images/favicon.png");
            setPage(HOME_PAGE);
        }
    </script>
  </body>
</html>
